name: Build & Test iTerminal (TypeScript + iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-wasm-jit:
    name: Typecheck & Test wasm-jit (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wasm-jit devDependencies
        working-directory: wasm-jit
        run: npm install

      - name: TypeScript typecheck (tsc --noEmit)
        working-directory: wasm-jit
        run: npm run typecheck

      - name: Run 19 end-to-end & benchmark tests
        working-directory: wasm-jit
        run: npm test

  build-ios-ipa:
    name: Build Unsigned iOS IPA (esbuild + Alpine RootFS + XcodeGen)
    needs: test-wasm-jit
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile TypeScript wasm-jit into single WKWebView bundle
        working-directory: wasm-jit
        run: |
          npm install
          npm run build:ios

      - name: Bundle iterminal-runtime.js & Alpine AArch64 minirootfs
        run: |
          mkdir -p ios-app/Resources/runtime
          cp wasm-jit/dist/ios/iterminal-runtime.js ios-app/Resources/runtime/
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/aarch64/alpine-minirootfs-3.20.3-aarch64.tar.gz \
            | gunzip > ios-app/Resources/runtime/alpine-minirootfs.tar
          ls -lh ios-app/Resources/runtime/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-app
        run: xcodegen generate

      - name: Build unsigned iOS app (iphoneos Release)
        run: |
          xcodebuild \
            -project ios-app/iTerminal.xcodeproj \
            -scheme iTerminal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/iTerminal.app dist/Payload/
          cd dist
          zip -r -q iTerminal-unsigned.ipa Payload
          ls -lh iTerminal-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iTerminal-unsigned-ipa
          path: dist/iTerminal-unsigned.ipa
          retention-days: 14
